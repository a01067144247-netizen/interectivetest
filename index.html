<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그림판 — 마우스로 그리기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="group">
        <span class="label">색</span>
        <div id="palette" class="palette" aria-label="색상 팔레트"></div>
      </div>
      <div class="group">
        <label class="label" for="width">굵기</label>
        <input id="width" type="range" min="1" max="48" value="4" />
        <output id="widthOut" for="width">4</output>
      </div>
      <div class="group">
        <button type="button" id="toolPen" class="btn active" aria-pressed="true">펜</button>
        <button type="button" id="toolErase" class="btn" aria-pressed="false">지우개</button>
      </div>
      <div class="group">
        <button type="button" id="btnClear" class="btn danger">전체 지우기</button>
        <button type="button" id="btnSave" class="btn primary">PNG 저장</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="board" width="1200" height="800" aria-label="그리기 캔버스"></canvas>
    </main>

    <p class="hint">마우스로 드래그해 그리세요. 지우개는 캔버스 위를 지웁니다.</p>

    <script src="draw.js" defer></script>
  </body>
</html>
